name: build

# CI only: assemble, unit tests and lint. No release signing and no secrets,
# so a pull request from a fork can never touch the release key.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: assemble + test + lint
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      # The ubuntu runner image already ships a working Android SDK and
      # cmdline-tools. setup-android@v3 re-downloads cmdline-tools 16.0, whose
      # `sdkmanager --licenses` fails on that image, so the preinstalled SDK is
      # used instead. cmdline-tools/latest/bin is NOT on PATH, hence the
      # explicit path.
      - name: Install Android SDK packages
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          echo "Using SDK: $SDK"
          test -x "$SDKMANAGER"
          echo "sdk.dir=$SDK" >> local.properties
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Assemble debug, run unit tests and lint
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lint

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 7
